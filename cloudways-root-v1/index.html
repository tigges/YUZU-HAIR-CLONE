<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YUZU V1 Workspace</title>
    <meta
      name="description"
      content="Main workspace for developing YUZU V1 at root."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #f3f1ea;
        --ink: #1c2d24;
        --soft: #4f5f58;
        --line: #d8d2c3;
        --accent: #d8b66d;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--ink);
        font-family: "Inter", Arial, sans-serif;
      }

      .shell {
        width: min(900px, 92vw);
        border: 1px solid var(--line);
        background: #fcfbf8;
        padding: clamp(1.2rem, 2vw, 2rem);
      }

      h1 {
        margin: 0 0 0.4rem;
        font-family: "Cormorant Garamond", Georgia, serif;
        font-size: clamp(2rem, 4.2vw, 3.2rem);
        line-height: 1.1;
      }

      p {
        margin: 0.35rem 0;
        color: var(--soft);
      }

      .badge {
        display: inline-block;
        margin-top: 0.75rem;
        border: 1px solid var(--accent);
        color: #6d5628;
        background: #fff;
        padding: 0.35rem 0.65rem;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        font-size: 0.72rem;
      }

      .links {
        margin-top: 1rem;
        display: flex;
        gap: 0.7rem;
        flex-wrap: wrap;
      }

      a {
        color: inherit;
        text-decoration: none;
        border: 1px solid var(--line);
        padding: 0.55rem 0.75rem;
        font-size: 0.88rem;
        background: #fff;
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <h1>YUZU V1 — Main Workspace</h1>
      <p>
        Root URL now reserved for building the new YUZU V1 site architecture.
      </p>
      <p>
        Existing planning frame moved to <code>/concept</code> for reference.
      </p>
      <span class="badge">Fast iteration mode</span>
      <div class="links">
        <a href="/concept/">Open Concept Frame</a>
      </div>
    </main>
  </body>
</html>
